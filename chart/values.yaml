image:
  repository: ghcr.io/1fabi0/drydock
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

sidecars:
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0

plugin:
  name: 1fabi0.drydock.io

storage:
  className: drydock
  hostStorageRoot: /var/lib/drydock/volumes
  isDefault: true
  defaultReclaimPolicy: Delete
  nodeCleanUpCronExpression: "*/15 * * * *"
  volumeCleanupThresholdSeconds: 600
kubelet:
  rootDir: /var/lib/kubelet

network:
  http3Port: 50443
  hostNetwork: true # Allows QUIC/UDP Node-to-Node Direct Access without Overlay-NAT-Overhead

tls:
  nodeCacheCertPath: /var/lib/drydock/pki
  certificate:
    duration: 2160h # 90 Days
    renewBeforeSeconds: 2592000 # 30 Days
  certManager:
    enabled: true
    createSelfSignedCA: true
    

backup:
  enabled: false
  defaultBackupEnabled: true
  cronExpression: "0 2 * * *"
  s3Endpoint: ""
  bucket: ""
  existingSecret: "" # Key: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  s3AccessKey: ""
  s3SecretKey: ""