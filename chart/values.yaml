image:
  repository: ghcr.io/1fabi0/drydock
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

sidecars:
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0

plugin:
  name: 1fabi0.drydock.io

storage:
  className: drydock
  hostStorageRoot: /var/lib/drydock/volumes
  isDefault: true
  defaultReclaimPolicy: Delete

kubelet:
  rootDir: /var/lib/kubelet

network:
  http3Port: 50443
  hostNetwork: true # Allows QUIC/UDP Node-to-Node Direct Access without Overlay-NAT-Overhead

tls:
  certManager:
    enabled: true
    clusterIssuer: ""
    createSelfSignedCA: true
    secretName: ""
    duration: 2160h # 90 Days
    renewBefore: 360h # 15 Days

backup:
  enabled: false
  cronExpression: "0 2 * * *"
  s3Endpoint: ""
  bucket: ""
  existingSecret: "" # Key: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  s3AccessKey: ""
  s3SecretKey: ""