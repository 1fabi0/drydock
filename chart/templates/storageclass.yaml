apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storage.className }}
  labels: {{- include "drydock.labels" . | nindent 4 }}
  {{- if .Values.storage.isDefault }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: {{ include "drydock.driverName" . }}
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: {{ .Values.storage.defaultReclaimPolicy }}
allowVolumeExpansion: false