{{- if and .Values.tls.certManager.enabled .Values.tls.certManager.createSelfSignedCA }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "drydock.fullname" . }}-selfsigned-bootstrapper
  namespace: {{ include "drydock.namespace" . }}
  labels: {{- include "drydock.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "drydock.fullname" . }}-root-ca
  namespace: {{ include "drydock.namespace" . }}
  labels: {{- include "drydock.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: "Drydock Internal Root CA"
  secretName: {{ include "drydock.fullname" . }}-root-ca-secret
  duration: 87600h # 10 years
  renewBefore: 8760h # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "drydock.fullname" . }}-selfsigned-bootstrapper
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "drydock.issuerName" . }}
  namespace: {{ include "drydock.namespace" . }}
  labels: {{- include "drydock.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "drydock.fullname" . }}-root-ca-secret
{{- end }}