apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ include "drydock.driverName" . }}
  labels:
    {{- include "drydock.labels" . | nindent 4 }}
spec:
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes:
    - Persistent
  storageCapacity: true
  fsGroupPolicy: File