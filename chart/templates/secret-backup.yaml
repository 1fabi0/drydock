{{- if and .Values.backup.enabled (not .Values.backup.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drydock.fullname" . }}-s3-credentials
  namespace: {{ include "drydock.namespace" . }}
  labels: {{- include "drydock.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.backup.s3AccessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.backup.s3SecretKey | quote }}
{{- end }}